name: desktop

# 桌面客户端（Electron）构建
#   - 手动触发：只在 CI 上验证能不能打出安装包
#   - tag 触发：打出 Windows 安装包并挂到对应 Release
#
# 代码签名：如果仓库里配了 WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD 两个 secret，
# electron-builder 会自动签名；没配就跳过（会弹 SmartScreen，见 docs/SIGNING.md）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # 签名（可选）：把 PFX 转成 base64 存进 secret 即可，无需改代码
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 开始页冒烟
        run: npx electron . --smoke

      - name: 内置服务器冒烟
        run: npx electron . --smoke-host

      - name: 打包安装程序
        run: npx electron-builder --win nsis --x64

      - name: 检查签名状态
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/Nest-Setup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "签名状态: $($sig.Status)"
          if ("${{ secrets.WIN_CSC_LINK }}" -ne "") {
            if ($sig.Status -ne 'Valid') { throw "配了签名 secret 但产物没签名: $($sig.Status)" }
          } else {
            Write-Host "未配置签名证书，跳过（安装时会弹 SmartScreen，属预期）"
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Nest-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release upload "${{ github.ref_name }}" desktop/dist/*.exe --clobber
