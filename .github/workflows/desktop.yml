name: desktop

# 桌面客户端（Electron）构建
#   - 手动触发：只在 CI 上验证能不能打出安装包
#   - tag 触发：打出 Windows 安装包并挂到对应 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 开始页冒烟
        run: npx electron . --smoke

      - name: 内置服务器冒烟
        run: npx electron . --smoke-host

      - name: 打包安装程序
        run: npx electron-builder --win nsis --x64

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Nest-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release upload "${{ github.ref_name }}" desktop/dist/*.exe --clobber
