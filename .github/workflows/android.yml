name: android

# 安卓客户端（Capacitor WebView 壳）
#   - 手动触发：验证 APK 能否构建
#   - tag 触发：构建 debug APK 并挂到 Release
#
# 说明：debug APK 用 Android 调试签名，可以直接侧载安装（不需要签名证书）。
#       要上架应用商店或做正式发布，需要自己生成 keystore 并配置 signingConfig。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 同步 web 资源到 android 工程
        run: npx cap sync android

      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 改名并上传
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Nest-android-${GITHUB_REF_NAME}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: Nest-Android
          path: mobile/out/*.apk
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release upload "${GITHUB_REF_NAME}" mobile/out/*.apk --clobber
