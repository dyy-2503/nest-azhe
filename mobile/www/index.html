<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="brand">
    <img class="logo" src="icon.png" alt="">
    <div>
      <h1>Nest</h1>
      <p>自己的群，自己的人。</p>
    </div>
  </div>

  <form id="form" autocomplete="off">
    <label class="field">
      服务器地址
      <input id="url" type="url" inputmode="url" placeholder="https://nest-xxx.ts.net" required>
    </label>
    <p class="hint">找群主要这个地址。如果他在同一个 Wi-Fi 下，也可能是一个 http://192.168.x.x:8787 的地址。</p>
    <button type="submit" class="primary">进入</button>
  </form>

  <div class="recent" id="recent" hidden>
    <p class="label">最近用过</p>
    <div id="recent-list"></div>
  </div>

  <p class="foot">只和 AI 聊天 · 朋友之间不开口子</p>
</main>
<script src="app.js"></script>
</body>
</html>
